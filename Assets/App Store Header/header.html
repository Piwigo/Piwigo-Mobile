<!doctype html>
<!--
  Piwigo — App Store product page header (3840 × 1646, 21:9).

  Open in a browser to preview the loop (scaled to the window).
    header.html?safe=1   outlines Apple's art safe area (1646 × 661 at x 1097, y 493)
    header.html?t=3.6    freezes the frame at t = 3.6 s
  render.mjs loads it with ?capture=1 and calls window.renderAt(t) for every frame.
  Everything is a pure function of t, so frame 0 and frame T are identical (seamless loop).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Piwigo App Store Header</title>
<style>
  html, body { margin: 0; background: #1b1b1b; overflow: hidden; }
  #stage {
    position: absolute; left: 0; top: 0;
    width: 3840px; height: 1646px; overflow: hidden;
    background: #ece7df; transform-origin: 0 0;
  }
  #wall { position: absolute; left: 1920px; top: 823px; width: 0; height: 0; transform: rotate(-8deg); }
  .col  { position: absolute; top: 0; will-change: transform; }
  .tile {
    position: absolute; left: 0; display: block;
    border-radius: 30px; object-fit: cover;
    box-shadow: 0 12px 34px rgba(0, 0, 0, .28);
  }
  /* Light wash keeping the dark wordmark legible over the photos. */
  #wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 1300px 660px at 1920px 823px,
        rgba(250, 248, 245, .97) 0%, rgba(250, 248, 245, .94) 48%,
        rgba(250, 248, 245, .55) 78%, rgba(250, 248, 245, 0) 100%);
  }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #logo  { position: absolute; left: 1220px; top: 648.8px; width: 1400px; height: 348.4px; overflow: visible; }
  #safe  {
    position: absolute; left: 1097px; top: 493px; width: 1646px; height: 661px;
    outline: 4px dashed #e0245e; display: none; pointer-events: none;
  }
</style>
</head>

      </g>
      <!-- Camera symbol; #camera is scaled around the lens centre (645.164, 524.122) on each shot -->

        <path fill="#f70" transform="translate(577 592.285) rotate(-90)" d="M36.12,0h64.088a36.12,36.12,0,0,1,36.12,36.12v84.911L131.486,131.4l-10.5,4.93H36.12A36.12,36.12,0,0,1,0,100.208V36.12A36.12,36.12,0,0,1,36.12,0Z"/>

<script src="photos.js"></script>
<script>
(() => {
  // ---- Timeline ------------------------------------------------------------
  const T = 20;                 // loop length in seconds (Apple: 5–30 s)
  const SHOTS = [3.5, 13.5];    // shutter clicks; frame 0 stays the full logo (poster frame)

  // ---- Photo wall ----------------------------------------------------------
  // 6 columns × 3 photos = the 18 Delft photos, each shown once per strip.
  // The rotated canvas needs the wall to cover about 4032 × 2164 px around its centre.
  const COLS = 6, COL_W = 700, GAP = 36, PER_COL = 3;
  const HALF_COVER = 1120;
  const PITCH = COL_W + GAP;

  function mulberry32(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(2026);
  const photos = (window.PHOTOS || []).slice();
  for (let i = photos.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [photos[i], photos[j]] = [photos[j], photos[i]];
  }

  const wall = document.getElementById('wall');
  const columns = [];
  const loads = [];
  for (let c = 0; c < COLS; c++) {
    const el = document.createElement('div');
    el.className = 'col';
    el.style.left = ((c - (COLS - 1) / 2) * PITCH - COL_W / 2) + 'px';
    wall.appendChild(el);
    const srcs = [];
    for (let k = 0; k < PER_COL; k++) srcs.push(photos[(c * PER_COL + k) % photos.length]);
    columns.push({ el, srcs, P: 0, phase: rand(), dir: c % 2 ? 1 : -1 });
  }

  // Each column repeats its strip of period P enough times to cover ±HALF_COVER;
  // translating it by exactly one P over the loop makes the motion seamless.
  async function buildColumn(col) {
    const imgs = await Promise.all(col.srcs.map(src => new Promise((ok, ko) => {
      const im = new Image();
      im.onload = () => im.decode().then(() => ok(im), () => ok(im));
      im.onerror = () => ko(new Error('Cannot load ' + src));
      im.src = src;
    })));
    const heights = imgs.map(im => Math.round(COL_W * Math.min(1.5, Math.max(0.66, im.naturalHeight / im.naturalWidth))));
    col.P = heights.reduce((s, h) => s + h + GAP, 0);
    // Strip top sits at off − lead·P with off ∈ [0, P): it stays above −HALF_COVER and
    // the last copy ends below +HALF_COVER.
    col.lead = Math.ceil(HALF_COVER / col.P) + 1;
    const copies = col.lead + Math.ceil(HALF_COVER / col.P) + 1;
    for (let r = 0; r < copies; r++) {
      let y = r * col.P;
      imgs.forEach((im, i) => {
        const tile = document.createElement('img');
        tile.className = 'tile';
        tile.src = im.src;
        tile.style.top = y + 'px';
        tile.style.width = COL_W + 'px';
        tile.style.height = heights[i] + 'px';
        col.el.appendChild(tile);
        loads.push(tile.decode().catch(() => {}));
        y += heights[i] + GAP;
      });
    }
  }

  // ---- Easing --------------------------------------------------------------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
  const easeInCubic = x => x * x * x;
  const easeOutBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

  // 0 = lens open, 1 = shutter closed (dark disc fills the white ring); overshoots below 0 on reopening.
  function shutter(dt) {
    if (dt < 0 || dt > 0.75) return 0;
    if (dt < 0.08) return easeInCubic(dt / 0.08);
    if (dt < 0.16) return 1;
    return 1 - easeOutBack(clamp((dt - 0.16) / 0.55));
  }

  const lens = document.getElementById('lens');
  const camera = document.getElementById('camera');
  const glow = document.getElementById('flashGlow');
  const flash = document.getElementById('flash');
  const LENS_R = 28.623, RING_R = 40.426;

  function renderAt(t) {
    t = ((t % T) + T) % T;

    for (const col of columns) {
      const off = (((col.phase + col.dir * t / T) % 1) + 1) % 1 * col.P;
      col.el.style.transform = `translateY(${(off - col.lead * col.P).toFixed(2)}px)`;
    }

    let s = 0, press = 0, glowA = 0, glowR = 8.557, flashA = 0;
    for (const t0 of SHOTS) {
      const dt = t - t0;
      s += shutter(dt);
      if (dt >= 0 && dt < 1.2) {
        press += dt < 0.08 ? easeOutCubic(dt / 0.08) : Math.exp(-(dt - 0.08) / 0.12);
        const g = dt < 0.06 ? dt / 0.06 : Math.exp(-(dt - 0.06) / 0.2);
        glowA += g;
        glowR = Math.max(glowR, 8.557 + 34 * easeOutCubic(clamp(dt / 0.35)));
        flashA += dt < 0.08 ? 0 : 0.42 * (dt < 0.11 ? (dt - 0.08) / 0.03 : Math.exp(-(dt - 0.11) / 0.16));
      }
    }
    lens.setAttribute('r', (LENS_R + (RING_R - LENS_R) * s).toFixed(3));
    const k = 1 - 0.035 * clamp(press);
    camera.setAttribute('transform', `translate(645.164 524.122) scale(${k.toFixed(4)}) translate(-645.164 -524.122)`);
    glow.setAttribute('opacity', clamp(glowA).toFixed(3));
    glow.setAttribute('r', glowR.toFixed(2));
    flash.style.opacity = clamp(flashA).toFixed(3);
  }

  // ---- Boot ----------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  const capture = params.has('capture');
  if (params.has('safe')) document.getElementById('safe').style.display = 'block';

  function fit() {
    const stage = document.getElementById('stage');
    if (capture) { stage.style.transform = 'none'; return; }
    const k = Math.min(innerWidth / 3840, innerHeight / 1646);
    stage.style.transform = `translate(${(innerWidth - 3840 * k) / 2}px, ${(innerHeight - 1646 * k) / 2}px) scale(${k})`;
  }
  addEventListener('resize', fit);
  fit();

  window.LOOP_SECONDS = T;
  window.renderAt = renderAt;
  window.ready = Promise.all(columns.map(buildColumn))
    .then(() => Promise.all(loads))
    .then(() => document.fonts.ready)
    .then(() => { renderAt(0); return true; });

  window.ready.then(() => {
    if (capture) return;
    if (params.has('t')) { renderAt(parseFloat(params.get('t'))); return; }
    const start = performance.now();
    const tick = now => { renderAt((now - start) / 1000); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
})();
</script>
</body>
